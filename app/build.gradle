plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePwd = (project.findProperty("AKEY_STORE_PWD") ?: "MakMakPandugo") as String

android {
    namespace 'id.aksisoft.aksiphoto'
    compileSdk 36

    defaultConfig {
        applicationId "id.aksisoft.aksiphoto"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
        resValue "string", "app_name", "AksiPhoto"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/tukangdigital.keystore")
            storePassword keystorePwd
            keyAlias "tukangdigital"
            keyPassword keystorePwd
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
}
